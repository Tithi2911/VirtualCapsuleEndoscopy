[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secondlook-crc"
version = "0.1.0"
description = "Offline AI second-look review of colonoscopy and capsule endoscopy recordings (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
model = ["onnxruntime>=1.17"]
train = ["torch>=2.2", "torchvision>=0.17", "onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8"]

[project.scripts]
secondlook = "secondlook.cli:main"

[tool.setuptools.packages.find]
include = ["secondlook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end classifier training and analysis on synthetic data (about a minute on a CPU); run by default, skip with -m 'not slow'",
]
